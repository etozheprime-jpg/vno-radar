<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="description" content="Live arrivals at Vilnius Airport (VNO)" />
    <meta name="theme-color" content="#070b16" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

    <script>
      // avoid a flash of the wrong theme
      try { var t = JSON.parse(localStorage.getItem('vno.settings') || '{}').theme; if (t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.theme = 'light'; } catch (e) {}
    </script>
  </head>

    <div id="root"></div>

  </body>
